  .world-egg.near .interact-hint { opacity: 1; }

  .side-panel { position: fixed; top: 0; left: 64px; bottom: 0; width: 380px; max-width: calc(100vw - 64px); background: rgba(10,5,30,0.97); border-right: 1px solid #2a2050; z-index: 300; display: flex; flex-direction: column; transform: translateX(calc(-100% - 64px)); transition: transform 0.3s ease; box-shadow: 10px 0 40px rgba(0,0,0,0.6); }

  .upgrade-info { font-size: 0.9em; color: #8b8fb8; margin-bottom: 10px; }

  .upgrade-btn { width: 100%; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; font-size: 0.9em; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; transition: 0.15s; }
  .upgrade-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }

  .sell-all-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-weight: 900; font-size: 1em; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transition: 0.15s; }

  .world-select-card { background: rgba(20,15,50,0.8); border: 2px solid #2a2050; border-radius: 14px; padding: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }

  .toast { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-30px); background: rgba(20,15,50,0.95); border: 1px solid #8b5cf6; padding: 14px 28px; border-radius: 12px; font-weight: 900; opacity: 0; transition: all 0.4s ease; pointer-events: none; z-index: 500; box-shadow: 0 8px 32px rgba(139,92,246,0.5); }

function fmt(n) {
  if (n < 0) return "-" + fmt(-n);
  if (n < 1000) return n.toFixed(n < 10 ? 2 : 1).replace(/\.0+$/, "");
  const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad"];
  let tier = 0; let val = n;
  while (val >= 1000 && tier < suffixes.length - 1) { val /= 1000; tier++; }
  return val.toFixed(val < 10 ? 2 : 1).replace(/\.0+$/, "") + suffixes[tier];
}

// ======================= ФОРМАТ ВРЕМЕНИ =======================
function fmtTime(ms) {
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  
  if (h > 0) {
    return m > 0 ? `${h}h ${m}m` : `${h}h`;
  }
  if (m > 0) {
    return s > 0 ? `${m}m ${s}s` : `${m}m`;
  }
  return `${s}s`;
}

function toast(text, cls="") { const el = $("toast"); el.textContent = text; el.className = "toast show " + cls; clearTimeout(toast._t); toast._t = setTimeout(() => el.className = "toast " + cls, 2400); }

let menuStarted = false; 
let adminMusicOn = false;
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  ["legendary", "secret", "eternal", "divine", "send"].forEach(key => {
    const s = SOUNDS[key];
    if (!s) return;
    try {
      s.volume = 0;
      const p = s.play();
      if (p) p.then(() => {
        s.pause();
        s.currentTime = 0;
        s.volume = 1.0;
      }).catch(() => {});
    } catch (e) {}
  });
}

function tryPlayMenu() { 
  if (menuStarted) return; 
  menuStarted = true; 
  unlockAudio();
  if (adminMusicOn) SOUNDS.admin.play().catch(()=>{}); 
  else SOUNDS.menu.play().catch(()=>{}); 
}
["click", "keydown", "touchstart"].forEach(ev => window.addEventListener(ev, tryPlayMenu, { once: true }));

function playSpawnSound(rarity) { 
  const s = SOUNDS[rarity]; if (!s) return; 
  try { 
    s.currentTime = 0; 
    s.volume = 1.0; 
    s.play().catch(()=>{}); 
  } catch(e) {} 
}

let lastPosSend = 0;
function updatePlayerPos() {
  let dx = 0, dy = 0;
  if (keys["w"] || keys["arrowup"] || keys["ц"]) dy -= playerSpeed;
  if (keys["s"] || keys["arrowdown"] || keys["ы"]) dy += playerSpeed;
  if (keys["a"] || keys["arrowleft"] || keys["ф"]) dx -= playerSpeed;
  if (keys["d"] || keys["arrowright"] || keys["в"]) dx += playerSpeed;

  if (dx !== 0 || dy !== 0) {
    playerPos.x += dx; playerPos.y += dy;
    const w = window.innerWidth - 64; const h = window.innerHeight;
    playerPos.x = Math.max(40, Math.min(w - 80, playerPos.x));
    playerPos.y = Math.max(80, Math.min(h - 80, playerPos.y));
    playerEl.style.left = playerPos.x + "px"; playerEl.style.top = playerPos.y + "px";
    if (dx < 0) bodyWrap.style.transform = "scaleX(-1)";
    else if (dx > 0) bodyWrap.style.transform = "scaleX(1)";
    
    const now = Date.now();
    if (now - lastPosSend > 100) {
      lastPosSend = now;
      update(ref(db, "egg_players/" + PLAYER_ID), { x: playerPos.x, y: playerPos.y, world: state.currentWorld, lastSeen: Date.now() });
    }
  }

  updateNearestEgg();

}

const worldTimeRef = ref(db, "egg_global/worldTime");
let cycleStartGlobal = 0;
onValue(worldTimeRef, (snap) => {
  let t = snap.val();
  if (!t) { t = Date.now(); set(worldTimeRef, t); }
  cycleStartGlobal = t;
});
function getPhaseData() {
  const DAY_MS = 60 * 1000; const NIGHT_MS = 10 * 1000; const CYCLE_MS = DAY_MS + NIGHT_MS;
  if (!cycleStartGlobal) return { phase: "night", msLeft: NIGHT_MS, total: NIGHT_MS, cycleNum: 0 };
  const inCycle = ((Date.now() - cycleStartGlobal) % CYCLE_MS + CYCLE_MS) % CYCLE_MS;
  const cycleNum = Math.floor((Date.now() - cycleStartGlobal) / CYCLE_MS);
  if (inCycle < NIGHT_MS) return { phase: "night", msLeft: NIGHT_MS - inCycle, total: NIGHT_MS, cycleNum };
  return { phase: "day", msLeft: CYCLE_MS - inCycle, total: DAY_MS, cycleNum };
}

// ======================= ЯЙЦА =======================
const eggsRef = ref(db, "egg_global/eggs");
let allEggs = {};
let lastEggIds = new Set();
let isSpawning = false;

onValue(eggsRef, (snap) => {
  const newEggs = snap.val() || {};
  
  for (const id in newEggs) {
    if (!lastEggIds.has(id)) {
      const egg = newEggs[id];
      if (egg && egg.world === state.currentWorld) {
        playSpawnSound(egg.rarity);
      }
    }
  }
  
  lastEggIds = new Set(Object.keys(newEggs));
  allEggs = newEggs;
  renderAllEggs();
});

function rollEggRarity() {
  const luck = adminState.luckBoost || 1;
  const weighted = {}; let total = 0;
  for (const key in EGGS_BASE) { let w = EGGS_BASE[key].chance; if (key !== "legendary") w *= luck; weighted[key] = w; total += w; }
  const r = Math.random() * total; let acc = 0;
  for (const key in weighted) { acc += weighted[key]; if (r < acc) return key; }
  return "legendary";
}
function randomSize(r) { const cfg = EGGS_BASE[r]; let s = cfg.minSize + Math.random() * (cfg.maxSize - cfg.minSize); if (r === "divine") s = cfg.minSize + Math.pow(Math.random(), 2) * (cfg.maxSize - cfg.minSize); s *= (adminState.sizeBoost || 1); return Number(s.toFixed(2)); }

function renderAllEggs() {
  const container = $("eggsContainer");
  container.innerHTML = "";
  
  for (const id in allEggs) {
    const egg = allEggs[id];
    if (egg.world !== state.currentWorld) continue;
    
    const eggEl = document.createElement("div");
    eggEl.className = "world-egg " + EGGS_BASE[egg.rarity].cls;
    eggEl.dataset.id = id;
    eggEl.style.left = egg.x + "px"; 
    eggEl.style.top = egg.y + "px";
    
    const scale = Math.max(0.01, Math.min(100, Number(egg.size) || 1));
    eggEl.style.transform = `scale(${scale})`;
    
    eggEl.innerHTML = `<div class="world-egg-shape"></div><div class="interact-hint">Нажми E</div>`;
    eggEl.onclick = (e) => tryCollectEgg(id, egg, e);
    container.appendChild(eggEl);
  }
  updateNearestEgg();
}

function updateNearestEgg() {
  document.querySelectorAll(".world-egg").forEach(el => {
    const left = parseFloat(el.style.left) || 0;
    const top = parseFloat(el.style.top) || 0;
    const dist = Math.hypot(playerPos.x - left, playerPos.y - top);
    if (dist < 120) el.classList.add("near");
    else el.classList.remove("near");
  });
}

function findNearestEggAndCollect() {
  let nearest = null;
  let minDist = 120;
  
  for (const id in allEggs) {
    const egg = allEggs[id];
    if (egg.world !== state.currentWorld) continue;
    const dist = Math.hypot(playerPos.x - egg.x, playerPos.y - egg.y);
    if (dist < minDist) {
      minDist = dist;
      nearest = { id, egg };
    }
  }
  
  if (nearest) {
    tryCollectEgg(nearest.id, nearest.egg, null);
  } else {
    toast("Рядом нет яиц", "divine");
  }
}

async function tryCollectEgg(eggId, egg, e) {
  const phase = getPhaseData();
  if (phase.phase !== "day") { toast("Ночью яйца не забрать", "divine"); return; }
  
  const dist = Math.hypot(playerPos.x - egg.x, playerPos.y - egg.y);
  if (dist > 120) { toast("Подойди ближе к яйцу!", "divine"); return; }
  
  const eggSnapshot = { rarity: egg.rarity, size: egg.size, petName: egg.petName };
  const eggRef = ref(db, "egg_global/eggs/" + eggId);
  
  let success = false;
  await runTransaction(eggRef, (data) => {
    if (data) { success = true; return null; }
    return data;
  });
  
  if (success) {
    const newEggId = "egg_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    state.pendingEggs.push({ 
      id: newEggId, rarity: eggSnapshot.rarity, size: eggSnapshot.size, 
      hatching: false, hatchStartAt: 0, hatchEndAt: 0, world: state.currentWorld,
      presetPetName: eggSnapshot.petName
    });
    toast(`Ты забрал ${EGGS_BASE[eggSnapshot.rarity].cls.toUpperCase()} яйцо!`, eggSnapshot.rarity);
    if (e) spawnFloat("🥚", e.clientX, e.clientY, "#fff");
    renderAllPanels(); updateHud(); saveState();
  } else {
    toast("Увы, яйцо уже забрали!", "divine");
  }
}

// ======================= ЦИКЛ =======================
function tick() {
  const p = getPhaseData();
  const isDay = p.phase === "day";
  
  $("phaseLabel").textContent = isDay ? "День" : "Ночь";
  $("timerHud").textContent = fmtTime(p.msLeft);
  $("phaseHud").className = "hud-card phase " + p.phase;
  $("timerBar").style.width = Math.max(0, Math.min(100, (p.msLeft / p.total) * 100)) + "%";
  $("timerBar").className = "timer-bar " + p.phase;

  if (isDay && Object.keys(allEggs).length === 0 && state.lastSpawnCycle < p.cycleNum && !isSpawning) {
    isSpawning = true;
    const rarity = rollEggRarity();
    const w = window.innerWidth - 64; const h = window.innerHeight;
    const eggId = "e_" + Date.now();
    
    update(eggsRef, {
      [eggId]: { 
        id: eggId,
        rarity, 
        size: randomSize(rarity), 
        world: state.currentWorld, 
        x: 100 + Math.random() * (w - 300), 
        y: 100 + Math.random() * (h - 300) 
      }
    }).then(() => {
      state.lastSpawnCycle = p.cycleNum;
      saveState();
      isSpawning = false;
    }).catch(() => { isSpawning = false; });
  }
  else if (!isDay && Object.keys(allEggs).length > 0) {
    set(eggsRef, null);
  }

  let hatched = false;
  for (let i = state.pendingEggs.length - 1; i >= 0; i--) {
    if (state.pendingEggs[i].hatching && Date.now() >= state.pendingEggs[i].hatchEndAt) {
      const egg = state.pendingEggs[i];
      let pet;
      if (egg.presetPetName) {
        pet = { name: egg.presetPetName, icon: "✨" };
      } else {
        const pool = WORLDS[egg.world || 1].pets[egg.rarity];
        pet = pool[Math.floor(Math.random() * pool.length)];
      }
      state.inventory.push({ 
        id: "pet_"+Date.now()+"_"+i, 
        rarity: egg.rarity, 
        size: egg.size, 
        name: pet.name, 
        icon: pet.icon, 
        world: egg.world || 1 
      });
      state.pendingEggs.splice(i, 1); hatched = true;
    }
  }
  if (hatched) { toast("Яйцо вылупилось!", "secret"); renderAllPanels(); updateHud(); saveState(); }

  // Обновляем прогресс-бары вылупления
  if (activePanel === "eggs" && state.pendingEggs.some(e => e.hatching)) {
    const body = $("sidePanelBody");
    const now = Date.now();
    state.pendingEggs.forEach(e => {
      if (!e.hatching) return;
      const left = Math.max(0, e.hatchEndAt - now);
      const dur = Math.max(1, e.hatchEndAt - e.hatchStartAt);
      const bar = body.querySelector(`.egg-card-progress-bar[data-id="${e.id}"]`);
      if (bar) bar.style.width = Math.min(100, ((dur - left) / dur) * 100) + "%";
      const txt = body.querySelector(`.egg-card-progress-text[data-id="${e.id}"]`);
      if (txt) txt.textContent = `Вылупление... ${fmtTime(left)}`;
    });
  }

  renderBoosts();
  requestAnimationFrame(tick);
}

setInterval(renderBoosts, 1000);

  state.currentWorld = targetWorld;

  update(ref(db, "egg_players/" + PLAYER_ID), { world: targetWorld });
  toast(`Переход в мир: ${WORLDS[targetWorld].name}`, "legendary");
  renderAllPanels(); saveState(); closePanel();

function renderEggsPanel() {

  body.innerHTML = state.pendingEggs.map(egg => {
    const data = EGGS_BASE[egg.rarity]; let bottom = "";

      const left = Math.max(0, egg.hatchEndAt - Date.now());
      const dur = Math.max(1, egg.hatchEndAt - egg.hatchStartAt);
      const pct = Math.min(100, ((dur - left) / dur) * 100);
      bottom = `<div class="egg-card-progress"><div class="egg-card-progress-bar" data-id="${egg.id}" style="width:${pct}%"></div></div><div class="egg-card-progress-text" data-id="${egg.id}">Вылупление... ${fmtTime(left)}</div>`;
    } else {
      bottom = `<button class="egg-card-btn" data-hatch="${egg.id}">Вылупить</button>`;
    }
    return `<div class="egg-card ${data.cls}"><div class="egg-card-top"><div class="egg-card-preview"><div class="world-egg-shape ${data.cls}"></div></div><div class="egg-card-info"><div class="egg-card-name">${data.cls.toUpperCase()}</div></div></div>${bottom}</div>`;
  }).join("");
  body.querySelectorAll("button[data-hatch]").forEach(btn => btn.onclick = () => {
    const egg = state.pendingEggs.find(e => e.id === btn.dataset.hatch);
    if (egg && !egg.hatching) { egg.hatching = true; egg.hatchStartAt = Date.now(); egg.hatchEndAt = egg.hatchStartAt + Math.round(EGGS_BASE[egg.rarity].baseTime * Math.min(egg.size, 5)); renderEggsPanel(); saveState(); }
  });
}

function petIncome(p) { const world = WORLDS[p.world || 1]; return EGGS_BASE[p.rarity].income * p.size * (adminState.incomeBoost || 1) * world.incomeMult; }
function petSellPrice(pet) { return Math.round(petIncome(pet) * 100); }

function renderInventoryPanel() {
  const body = $("sidePanelBody");
  const totalPrice = state.inventory.reduce((s, p) => s + petSellPrice(p), 0);
  let html = "";
  if (state.inventory.length) html = `<button class="sell-all-btn" id="sellAllBtn">💰 Продать всё (${fmt(totalPrice)})</button>`;
  if (!state.inventory.length) { body.innerHTML = html + `<div class="empty-state"><div class="big">🎒</div>Пусто.</div>`; return; }
  html += state.inventory.map(p => {
    const data = EGGS_BASE[p.rarity]; const price = petSellPrice(p);
    return `<div class="pet-card ${data.cls}"><div class="pet-card-icon">${p.icon || "🥚"}</div><div class="pet-card-info"><div class="pet-card-name">${p.name || data.name}</div><div class="pet-card-income">+${fmt(petIncome(p))}/сек</div><div class="pet-card-price">💰 ${fmt(price)}</div></div><div class="pet-card-actions"><button class="pet-card-btn sell" data-sell="${p.id}">Продать</button><button class="pet-card-btn" data-aviary="${p.id}">В вольер</button></div></div>`;
  }).join("");
  body.innerHTML = html;
  $("sellAllBtn").onclick = () => { showConfirm(`Продать <b>всех питомцев</b> за <b>${fmt(totalPrice)} 🪙</b>?`, () => { state.coins += totalPrice; state.inventory = []; toast(`Продано за ${fmt(totalPrice)} 🪙`, "legendary"); renderAllPanels(); updateHud(); saveState(); }); };
  body.querySelectorAll("button[data-aviary]").forEach(btn => btn.onclick = () => { const idx = state.inventory.findIndex(p => p.id === btn.dataset.aviary); if (idx !== -1) { if (state.aviary.length >= state.aviarySlots) { toast(`Вольер заполнен!`, "divine"); return; } state.aviary.push(state.inventory.splice(idx, 1)[0]); toast("В вольер!", "legendary"); renderAllPanels(); updateHud(); saveState(); } });
  body.querySelectorAll("button[data-sell]").forEach(btn => btn.onclick = () => { const idx = state.inventory.findIndex(p => p.id === btn.dataset.sell); if (idx === -1) return; const pet = state.inventory[idx]; const price = petSellPrice(pet); showConfirm(`Продать <b>${pet.name}</b> за <b>${fmt(price)} 🪙</b>?`, () => { state.inventory.splice(idx, 1); state.coins += price; toast(`Продано за ${fmt(price)} 🪙`, pet.rarity); renderAllPanels(); updateHud(); saveState(); }); });
}

function renderAviaryPanel() {
  const body = $("sidePanelBody");
  const total = state.aviary.reduce((s, p) => s + petIncome(p), 0);
  const header = `<div class="income-summary">💰 ${fmt(total)}/сек</div><div class="slots-summary">Занято: <b>${state.aviary.length} / ${state.aviarySlots}</b></div>`;
  let upgradeHtml = "";
  if (state.aviarySlots < 16) { const cost = Math.round(100 * Math.pow(4.5, state.aviaryUpgradeLevel)); upgradeHtml = `<div class="upgrade-box"><div class="upgrade-title">⚡ Прокачка вольера</div><div class="upgrade-info">Слоты: <b>${state.aviarySlots}</b> → <b>${state.aviarySlots + 1}</b></div><button class="upgrade-btn" id="aviaryUpgradeBtn" ${state.coins >= cost ? "" : "disabled"}>Прокачать (${fmt(cost)} 🪙)</button></div>`; } else { upgradeHtml = `<div class="upgrade-box maxed"><div class="upgrade-title">🏆 Максимум</div><div class="upgrade-info">16 / 16</div></div>`; }
  if (!state.aviary.length) { body.innerHTML = header + upgradeHtml + `<div class="empty-state"><div class="big">🏡</div>Пусто.</div>`; bindAviary(); return; }
  const petsHtml = state.aviary.map(p => {
    const data = EGGS_BASE[p.rarity]; const price = petSellPrice(p);
    return `<div class="pet-card ${data.cls}"><div class="pet-card-icon">${p.icon || "🥚"}</div><div class="pet-card-info"><div class="pet-card-name">${p.name}</div><div class="pet-card-income">+${fmt(petIncome(p))}/сек</div></div><div class="pet-card-actions"><button class="pet-card-btn sell" data-sell-aviary="${p.id}">Продать</button></div></div>`;
  }).join("");
  body.innerHTML = header + upgradeHtml + petsHtml;
  bindAviary();
  body.querySelectorAll("button[data-sell-aviary]").forEach(btn => btn.onclick = () => { const idx = state.aviary.findIndex(p => p.id === btn.dataset.sellAviary); if (idx === -1) return; const pet = state.aviary[idx]; const price = petSellPrice(pet); showConfirm(`Продать <b>${pet.name}</b> за <b>${fmt(price)} 🪙</b>?`, () => { state.aviary.splice(idx, 1); state.coins += price; toast(`Продано за ${fmt(price)} 🪙`, pet.rarity); renderAllPanels(); updateHud(); saveState(); }); });
}
function bindAviary() { const btn = document.getElementById("aviaryUpgradeBtn"); if (!btn) return; btn.onclick = () => { const cost = Math.round(100 * Math.pow(4.5, state.aviaryUpgradeLevel)); if (state.coins < cost) return; state.coins -= cost; state.aviaryUpgradeLevel++; state.aviarySlots++; toast(`Вольер прокачан!`, "divine"); updateHud(); renderAllPanels(); saveState(); }; }

function renderAllPanels() {
  $("eggsBadge").style.display = state.pendingEggs.length ? "flex" : "none"; $("eggsBadge").textContent = state.pendingEggs.length;
  $("invBadge").style.display = state.inventory.length ? "flex" : "none"; $("invBadge").textContent = state.inventory.length;
  if (activePanel === "worlds") renderWorldsPanel();
  if (activePanel === "eggs") renderEggsPanel();
  if (activePanel === "inventory") renderInventoryPanel();
  if (activePanel === "aviary") renderAviaryPanel();
}
function updateHud() { $("coinsHud").textContent = fmt(state.coins); $("incomeHud").textContent = fmt(state.aviary.reduce((s, p) => s + petIncome(p), 0)); }
function spawnFloat(text, x, y, color="#fbbf24") { const el = document.createElement("div"); el.className = "float-num"; el.textContent = text; el.style.left = (x - 20) + "px"; el.style.top = y + "px"; el.style.color = color; el.style.textShadow = `0 0 20px ${color}`; document.body.appendChild(el); setTimeout(() => el.remove(), 1200); }
function showConfirm(text, onConfirm) { $("modalText").innerHTML = text; $("modalOverlay").classList.add("show"); const btnConfirm = $("modalConfirm"), btnCancel = $("modalCancel"); const close = () => $("modalOverlay").classList.remove("show"); btnCancel.onclick = close; btnConfirm.onclick = () => { close(); onConfirm(); }; }

// ======================= СОХРАНЕНИЕ =======================
let saveTimer = null;
function saveState() {
  const data = { nick: MY_NICK, x: playerPos.x, y: playerPos.y, world: state.currentWorld, coins: state.coins, pendingEggs: state.pendingEggs, inventory: state.inventory, aviary: state.aviary, lastSpawnCycle: state.lastSpawnCycle, lastSeen: Date.now(), aviaryUpgradeLevel: state.aviaryUpgradeLevel, aviarySlots: state.aviarySlots };
  localStorage.setItem("egg_state", JSON.stringify(data));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => update(playerRef, data).catch(()=>{}), 400);
}

async function loadState() {
  try {
    const snap = await get(playerRef);
    if (snap.exists()) {
      const d = snap.val();
      state.coins = Number(d.coins) || 0;
      state.pendingEggs = Array.isArray(d.pendingEggs) ? d.pendingEggs : [];
      state.inventory = Array.isArray(d.inventory) ? d.inventory : [];
      state.aviary = Array.isArray(d.aviary) ? d.aviary : [];
      state.currentWorld = Number(d.world) || 1;
      state.lastSpawnCycle = Number(d.lastSpawnCycle) || -1;
      state.aviaryUpgradeLevel = Number(d.aviaryUpgradeLevel) || 0;
      state.aviarySlots = Number(d.aviarySlots) || 7;
      if (d.x) playerPos.x = d.x; if (d.y) playerPos.y = d.y;
      playerEl.style.left = playerPos.x + "px"; playerEl.style.top = playerPos.y + "px";
    }
  } catch (e) {}
  updateHud(); renderAllPanels(); renderBoosts();
}

setInterval(() => { if (!state.aviary.length) return; const inc = state.aviary.reduce((s, p) => s + petIncome(p), 0); if (inc > 0) { state.coins += inc; updateHud(); saveState(); } }, 1000);

async function init() {
  await loadState();
  applyWorld();
  updatePlayerPos();
  $("loading").classList.add("hide");
  setTimeout(() => $("loading").style.display = "none", 500);
  requestAnimationFrame(tick);
}
init();
</script>
</body>
</html>
